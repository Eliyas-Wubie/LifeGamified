[project]
name = "lifegamified"
version = "0.1.0"
description = ""
authors = [
    {name = "Eliyas-Wubie",email = "115378907+Eliyas-Wubie@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy (>=2.0.46,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "kivy (>=2.3.1,<3.0.0)",
    "ffpyplayer (>=4.5.3,<5.0.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["."]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
